services:
  db:
    image: mysql:9.3.0
    container_name: raffle-mysql
    restart: "no"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: ${TIME_ZONE}
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # ping over TCP (127.0.0.1), not the socket (localhost): on first start MySQL runs a
      # temporary socket-only server during init, which would pass the check too early
      test: [ 'CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-u', 'root', '-p${MYSQL_ROOT_PASSWORD}' ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      MYSQL_HOST: db
    ports:
      - '5000:5000'
    volumes:
      - .:/app
    # apply pending migrations and create the admin user (if missing) on every start,
    # so a fresh clone is ready to use
    command: sh -c "flask db upgrade -d ./api/migrations && flask create-admin && flask run --debug --host=0.0.0.0"

volumes:
  mysql-data:
